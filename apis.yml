name: Agomab Therapeutics
description: >-
  Agomab Therapeutics is a clinical-stage biopharmaceutical company (Nasdaq: AGMB)
  developing novel disease-modifying therapies for fibro-inflammatory diseases,
  with an initial focus on chronic fibrotic indications of high unmet medical need
  such as Crohn's disease and idiopathic pulmonary fibrosis. Building on deep
  expertise in growth factor biology, Agomab advances a pipeline of small-molecule
  and antibody candidates targeting the pathways that drive tissue fibrosis and
  inflammation. Headquartered in Belgium with operations across Europe and the
  United States, the company was surfaced as a portfolio company of Canaan Partners
  and added to the API Evangelist network. As a biopharmaceutical company it
  publishes a corporate and investor-relations web presence rather than a public
  developer API surface; this profile captures its identity and public web
  properties for the network catalog.
